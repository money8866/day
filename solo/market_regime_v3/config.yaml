# Market Regime Engine V3
# 全量权重和阈值配置化（无任何硬编码）

general:
  lookback_days: 250
  trade_date: null  # null = auto

# ============================================================
# 指数配置
# ============================================================
indices:
  codes:
    - "000001.SH"   # 上证指数
    - "000300.SH"   # 沪深300
    - "000852.SH"   # 中证1000
    - "399006.SZ"   # 创业板
    - "000688.SH"   # 科创50
  # 基础权重
  base_weights:
    "000300.SH": 0.30
    "000852.SH": 0.25
    "399006.SZ": 0.20
    "000688.SH": 0.15
    "000001.SH": 0.10
  # 动态权重调节（市场状态→权重偏移）
  dynamic_weights:
    growth:
      "399006.SZ": 0.05
      "000688.SH": 0.05
      "000300.SH": -0.05
    value:
      "000300.SH": 0.05
      "000001.SH": 0.03
      "399006.SZ": -0.04
      "000688.SH": -0.04
    risk_on:
      "000852.SH": 0.05
      "399006.SZ": 0.03
      "000688.SH": 0.02
      "000300.SH": -0.05
    risk_off:
      "000300.SH": 0.05
      "000001.SH": 0.03
      "000852.SH": -0.04
      "399006.SZ": -0.02
      "000688.SH": -0.02

# ============================================================
# Index Strength 配置
# ============================================================
index_strength:
  window_trend: 60
  window_momentum: 20
  window_volatility: 20
  breakout_lookback: 20
  sub_weights:
    trend: 0.25
    momentum: 0.20
    relative_strength: 0.15
    breakout: 0.10
    ma_alignment: 0.10
    slope: 0.05
    macd: 0.05
    rsi: 0.03
    atr: 0.02
    volume: 0.05
  # 各子因子参数
  trend:
    ma_periods: [20, 60, 120]
    bullish_threshold: 0.6
    bearish_threshold: 0.3
  momentum:
    periods: [5, 20, 60]
    weights: [0.3, 0.5, 0.2]
  relative_strength:
    benchmark: "000300.SH"
    period: 60
    percentile_window: 250
  breakout:
    lookback: 20
    threshold_pct: 0.0
  ma_alignment:
    periods: [5, 10, 20, 60, 120]
    perfect_alignment_count: 5
    min_alignment_count: 3
  slope:
    ma_period: 20
    calc_period: 5
    bullish_slope: 0.0
  macd:
    fast: 12
    slow: 26
    signal: 9
  rsi:
    period: 14
    oversold: 30
    overbought: 70
  atr:
    period: 14
    low_vol_threshold: 0.5  # 百分位
  volume:
    ma_period: 20
    expansion_ratio: 1.2
    contraction_ratio: 0.8

# ============================================================
# Breadth Score 配置
# ============================================================
breadth:
  sample_size: 5000  # 最大样本数（全市场）
  lookback_ma: [5, 20, 60, 120]
  new_high_lookback: [20, 60]
  sub_weights:
    up_ratio: 0.20
    down_ratio: 0.05
    limit_up: 0.15
    limit_down: 0.05
    new_high_20: 0.12
    new_high_60: 0.08
    above_ma20: 0.10
    above_ma60: 0.08
    above_ma120: 0.05
    amount_spread: 0.07
    median_return: 0.05
  # 各子因子阈值
  up_ratio:
    excellent: 0.60
    good: 0.50
    poor: 0.30
  limit_up:
    excellent: 80
    good: 50
    poor: 20
  limit_down:
    max_acceptable: 10
  new_high:
    excellent: 0.10
    good: 0.05
    poor: 0.02
  above_ma:
    excellent: 0.50
    good: 0.35
    poor: 0.20

# ============================================================
# Sentiment Score 配置
# ============================================================
sentiment:
  sub_weights:
    limit_up_ratio: 0.20
    break_ratio: 0.10
    max_continuous: 0.15
    gem_count: 0.10
    north_flow: 0.15
    etf_flow: 0.15
    amount_change: 0.15
  # 阈值
  limit_up_ratio:
    excellent: 0.03
    good: 0.02
    poor: 0.01
  break_ratio:
    excellent: 0.20
    good: 0.30
    poor: 0.40
  max_continuous:
    excellent: 7
    good: 5
    poor: 3
  gem_count:  # 20cm 数量
    excellent: 10
    good: 5
    poor: 2
  north_flow:
    ma_period: 5
    excellent: 50  # 亿
    good: 20
    poor: -20
  etf_flow:
    ma_period: 5
    excellent: 0.02  # 2%增长
    good: 0.0
    poor: -0.02
  amount_change:
    ma_period: 5
    excellent: 0.15
    good: 0.05
    poor: -0.05

# ============================================================
# Style Score 配置
# ============================================================
style:
  categories:
    - name: "LargeCap"
      etf_codes: ["510050", "510300"]
      index_codes: ["000300.SH", "000001.SH"]
      weights: {momentum: 0.30, trend: 0.25, volume: 0.20, volatility: 0.15, breadth_contribution: 0.10}
    - name: "SmallCap"
      etf_codes: ["512100", "510500"]
      index_codes: ["000852.SH"]
      weights: {momentum: 0.35, trend: 0.20, volume: 0.20, volatility: 0.15, breadth_contribution: 0.10}
    - name: "Growth"
      etf_codes: ["159915", "588000"]
      index_codes: ["399006.SZ", "000688.SH"]
      weights: {momentum: 0.35, trend: 0.20, volume: 0.20, volatility: 0.15, breadth_contribution: 0.10}
    - name: "Value"
      etf_codes: ["512800", "515210"]
      index_codes: []
      weights: {momentum: 0.20, trend: 0.30, volume: 0.15, volatility: 0.20, breadth_contribution: 0.15}
    - name: "Technology"
      etf_codes: ["512480", "159995", "515980", "512720"]
      index_codes: []
      weights: {momentum: 0.35, trend: 0.20, volume: 0.20, volatility: 0.15, breadth_contribution: 0.10}
    - name: "Dividend"
      etf_codes: ["518880", "512800"]
      index_codes: []
      weights: {momentum: 0.15, trend: 0.35, volume: 0.15, volatility: 0.20, breadth_contribution: 0.15}
    - name: "Consumer"
      etf_codes: ["159928", "512690"]
      index_codes: []
      weights: {momentum: 0.25, trend: 0.30, volume: 0.15, volatility: 0.20, breadth_contribution: 0.10}
    - name: "Healthcare"
      etf_codes: ["512170", "159828", "159883"]
      index_codes: []
      weights: {momentum: 0.25, trend: 0.25, volume: 0.20, volatility: 0.20, breadth_contribution: 0.10}
    - name: "Military"
      etf_codes: ["512660", "512710", "512670"]
      index_codes: []
      weights: {momentum: 0.30, trend: 0.20, volume: 0.20, volatility: 0.20, breadth_contribution: 0.10}
    - name: "AI"
      etf_codes: ["515980", "159869"]
      index_codes: []
      weights: {momentum: 0.40, trend: 0.15, volume: 0.25, volatility: 0.10, breadth_contribution: 0.10}
  lookback: 60
  top_n: 3

# ============================================================
# Risk Appetite 配置
# ============================================================
risk_appetite:
  lookback: 60
  sub_weights:
    breadth: 0.25
    etf_breadth: 0.15
    sentiment: 0.20
    volatility: 0.20
    leader_strength: 0.20
  volatility:
    high_risk_threshold: 0.8  # volatility >80% percentile = high risk
    low_risk_threshold: 0.2
  etf_breadth:
    up_etf_ratio_excellent: 0.60
    up_etf_ratio_good: 0.40

# ============================================================
# Theme Resonance 配置
# ============================================================
theme_resonance:
  top_n: 10
  lookback: 60
  sub_weights:
    theme_strength: 0.25
    etf_strength: 0.25
    leader_strength: 0.20
    breadth_contribution: 0.15
    trend_alignment: 0.15

# ============================================================
# Market Score 权重
# ============================================================
market_score:
  weights:
    index_strength: 0.35
    breadth: 0.30
    sentiment: 0.15
    theme_resonance: 0.10
    risk_appetite: 0.10

# ============================================================
# State Machine 配置
# ============================================================
state_machine:
  method: "fuzzy"  # fuzzy | threshold
  # 状态定义
  states:
    - name: "Bear"
      description: "熊市"
      score_range: [0, 32]
      tags: ["RiskOff"]
    - name: "Recovery"
      description: "修复反弹"
      score_range: [32, 48]
      tags: ["RiskOn"]
    - name: "Neutral"
      description: "震荡中性"
      score_range: [48, 62]
      tags: []
    - name: "Bull"
      description: "牛市"
      score_range: [62, 82]
      tags: ["RiskOn", "Growth"]
    - name: "Euphoria"
      description: "情绪亢奋"
      score_range: [82, 100]
      tags: ["RiskOn"]
  # 情绪修正
  sentiment_override:
    sentiment_high_threshold: 0.70
    sentiment_low_threshold: 0.25
    euphoria_push: 8
    bear_pull: -8

# ============================================================
# Portfolio Exposure 配置
# ============================================================
exposure:
  model:
    type: "piecewise"  # piecewise | linear
    # V4: 更积极的基础仓位曲线（低分区间不放空仓）
    levels:
      - score_min: 0
        score_max: 30
        exposure_min: 0.10
        exposure_max: 0.20
      - score_min: 30
        score_max: 50
        exposure_min: 0.20
        exposure_max: 0.40
      - score_min: 50
        score_max: 70
        exposure_min: 0.40
        exposure_max: 0.60
      - score_min: 70
        score_max: 90
        exposure_min: 0.60
        exposure_max: 0.80
      - score_min: 90
        score_max: 100
        exposure_min: 0.80
        exposure_max: 1.00
    # V4: 风险偏好 → 乘数（0.6~1.3），替代旧的加减法
    risk_appetite_multiplier:
      min_multiplier: 0.6   # risk_score=0 时
      max_multiplier: 1.3   # risk_score=100 时
      score_min: 0
      score_max: 100
    # V4: Regime 仓位区间限制
    regime_limits:
      Bear:
        floor: 0.00
        cap: 0.10
      Recovery:
        floor: 0.15
        cap: 0.50
      Neutral:
        floor: 0.25
        cap: 0.65
      Bull:
        floor: 0.40
        cap: 0.80
      Euphoria:
        floor: 0.60
        cap: 1.00
    # V4: 热度对仓位的乘数调整（引用 heat_engine 的热度等级）
    heat_adjustment:
      enabled: true
  # 主题数量建议
  theme_count:
    levels:
      - score_min: 0
        score_max: 50
        min_themes: 0
        max_themes: 1
      - score_min: 50
        score_max: 60
        min_themes: 1
        max_themes: 2
      - score_min: 60
        score_max: 70
        min_themes: 1
        max_themes: 2
      - score_min: 70
        score_max: 80
        min_themes: 2
        max_themes: 3
      - score_min: 80
        score_max: 90
        min_themes: 3
        max_themes: 3
      - score_min: 90
        score_max: 100
        min_themes: 3
        max_themes: 5
  # ETF/Leader/Follower/Cash 配置比例
  etf_allocation:
    regimes:
      Bear:
        etf: 0.20
        leader: 0.00
        follower: 0.00
        cash: 0.80
      Recovery:
        etf: 0.40
        leader: 0.40
        follower: 0.00
        cash: 0.20
      Neutral:
        etf: 0.30
        leader: 0.35
        follower: 0.10
        cash: 0.25
      Bull:
        etf: 0.30
        leader: 0.50
        follower: 0.20
        cash: 0.00
      Euphoria:
        etf: 0.25
        leader: 0.55
        follower: 0.20
        cash: 0.00

# ============================================================
# Heat Engine 配置
# ============================================================
heat_engine:
  lookback_days: 250
  heat_periods: [5, 20, 60]
  sub_weights:
    volume_heat: 0.20
    profit_heat: 0.20
    limit_up_heat: 0.15
    leader_heat: 0.10
    etf_heat: 0.10
    theme_heat: 0.10
    capital_flow_heat: 0.10
    volatility_heat: 0.05
  # 热度修正系数（对仓位的影响）
  heat_adjustment:
    levels:
      - heat_min: 90
        heat_max: 100
        label: "Extreme Hot"
        exposure_multiplier: 0.85
        max_trades_per_day: 1
        style: "禁止追高，控制仓位，持股为主"
        reason: "市场过热，回调风险增大"
      - heat_min: 80
        heat_max: 90
        label: "Very Hot"
        exposure_multiplier: 0.95
        max_trades_per_day: 2
        style: "趋势交易，龙头优先"
        reason: "市场较热，适度控制追高"
      - heat_min: 70
        heat_max: 80
        label: "Hot"
        exposure_multiplier: 1.00
        max_trades_per_day: 3
        style: "趋势交易，龙头优先"
        reason: "市场活跃，正常交易"
      - heat_min: 60
        heat_max: 70
        label: "Warm"
        exposure_multiplier: 1.00
        max_trades_per_day: 3
        style: "正常交易"
        reason: "市场温和，正常交易"
      - heat_min: 50
        heat_max: 60
        label: "Normal"
        exposure_multiplier: 1.05
        max_trades_per_day: 3
        style: "正常交易"
        reason: "市场中性，适当增加仓位"
      - heat_min: 40
        heat_max: 50
        label: "Cool"
        exposure_multiplier: 0.90
        max_trades_per_day: 2
        style: "关注超跌，等待共振"
        reason: "市场偏冷，降低仓位等待信号"
      - heat_min: 30
        heat_max: 40
        label: "Cold"
        exposure_multiplier: 0.90
        max_trades_per_day: 1
        style: "精选机会"
        reason: "市场冷淡，精选个股机会"
      - heat_min: 0
        heat_max: 30
        label: "Ice"
        exposure_multiplier: 0.90
        max_trades_per_day: 0
        style: "重点观察，提前建立观察池"
        reason: "市场冰点，等待反转信号"
  # 热度趋势判断
  heat_trend:
    heating_threshold: 5  # 20日变化 >5
    cooling_threshold: -5
    collapse_threshold: -15

# ============================================================
# 风格建议映射
# ============================================================
style_suggestions:
  Growth_Technology: ["AI算力", "机器人", "创新药", "PCB", "半导体"]
  Growth: ["创新药", "医疗器械", "新能源"]
  Value: ["银行", "煤炭", "钢铁", "电力"]
  Technology: ["AI算力", "机器人", "半导体", "信创", "消费电子"]
  SmallCap: ["机器人", "AI应用", "军工"]
  LargeCap: ["银行", "保险", "白酒", "电力"]
  Dividend: ["红利", "银行", "煤炭", "电力"]
  Military: ["军工", "航空航天", "船舶"]
  Consumer: ["白酒", "旅游", "家电", "消费电子"]
  Healthcare: ["创新药", "医疗器械", "生物科技"]
  AI: ["AI算力", "机器人", "AI应用", "大模型", "PCB"]

# ============================================================
# 操作建议映射
# ============================================================
trading_advice:
  regimes:
    Bear: "清仓观望，等待趋势反转信号"
    Recovery: "低吸龙头，逐步建仓"
    Neutral: "精选主题，波段操作"
    Bull: "积极做多，持股为主"
    Euphoria: "积极做多，注意止盈"

# ============================================================
# 风险检测配置
# ============================================================
risk_detection:
  index_divergence:
    lookback: 20
    threshold: 0.05  # 指数间分化 >5%
  etf_divergence:
    lookback: 10
    threshold: 0.03
  leader_divergence:
    lookback: 5
    threshold: 0.05
  volume_price:
    shrink_rise_threshold: 0.8  # 缩量上涨（量比<0.8）
    expand_fall_threshold: 1.3  # 放量下跌（量比>1.3）
  high_divergence:
    lookback: 5
    divergence_pct: 0.03
  sentiment_retreat:
    sentiment_drop_threshold: 0.15  # 情绪一日下跌>15%
    consecutive_drop_days: 2

# ============================================================
# Theme Beta Engine 配置
# ============================================================
theme_beta:
  top_n: 5
  lookback: 60
  benchmark: "000300.SH"
  max_allocation_per_theme: 0.40
  min_allocation_per_theme: 0.05
  allocation_method: "risk_parity"
  sub_weights:
    theme_beta: 0.20
    theme_momentum: 0.25
    theme_trend: 0.20
    theme_etf_corr: 0.15
    theme_volatility: 0.10
    theme_lifecycle: 0.10
  beta:
    rolling_window: 60
    min_periods: 20
  momentum:
    periods: [5, 20, 60]
    weights: [0.2, 0.5, 0.3]

# ============================================================
# Leader Quality Engine 配置
# ============================================================
leader_quality:
  top_n_per_theme: 5
  enable_theme_optimizer: false  # 主题归属优化已禁用：以 build_theme_stock_map_v2.py 输出为准
  enable_dynamic_correlation: true  # 动态量价相关性分析(三因子模型)，解决双叙事交叉股归属
  sub_weights:
    cross_section: 0.40
    persistence: 0.30
    momentum: 0.20
    volume_health: 0.10
  cross_section:
    ret_60d: 0.20
    ret_20d: 0.15
    amount_rank: 0.20
    new_high_days: 0.10
    rsi_health: 0.10
    volatility_control: 0.10
    volume_ratio: 0.15
  persistence:
    tenure_days: 0.25
    rank_stability: 0.20
    top3_ratio_20d: 0.20
    top3_ratio_60d: 0.15
    rank_momentum: 0.20
  thresholds:
    min_tenure_days: 3
    min_ret_20d: 0.05
    max_volatility: 0.40

# ============================================================
# Trading Style Engine 配置
# ============================================================
trading_style:
  method: "matrix"
  styles:
    - name: "aggressive_pursuit"
      label: "积极追涨"
      description: "强势市场追涨龙头"
    - name: "pullback_buy"
      label: "回调低吸"
      description: "震荡/弱势市场低吸龙头"
    - name: "swing_trade"
      label: "波段操作"
      description: "中性市场高抛低吸"
    - name: "defensive_hold"
      label: "防御持有"
      description: "弱势市场持有现金/防御板块"
    - name: "right_side_follow"
      label: "右侧跟随"
      description: "修复反弹市场右侧入场"
  matrix:
    Bear:
      Ice: "defensive_hold"
      Cold: "defensive_hold"
      Cool: "defensive_hold"
      Normal: "pullback_buy"
      Warm: "pullback_buy"
      Hot: "pullback_buy"
      Very_Hot: "pullback_buy"
      Extreme_Hot: "defensive_hold"
    Recovery:
      Ice: "defensive_hold"
      Cold: "pullback_buy"
      Cool: "pullback_buy"
      Normal: "pullback_buy"
      Warm: "right_side_follow"
      Hot: "right_side_follow"
      Very_Hot: "swing_trade"
      Extreme_Hot: "swing_trade"
    Neutral:
      Ice: "pullback_buy"
      Cold: "pullback_buy"
      Cool: "pullback_buy"
      Normal: "swing_trade"
      Warm: "swing_trade"
      Hot: "right_side_follow"
      Very_Hot: "right_side_follow"
      Extreme_Hot: "pullback_buy"
    Bull:
      Ice: "right_side_follow"
      Cold: "right_side_follow"
      Cool: "right_side_follow"
      Normal: "right_side_follow"
      Warm: "aggressive_pursuit"
      Hot: "aggressive_pursuit"
      Very_Hot: "aggressive_pursuit"
      Extreme_Hot: "swing_trade"
    Euphoria:
      Ice: "aggressive_pursuit"
      Cold: "aggressive_pursuit"
      Cool: "aggressive_pursuit"
      Normal: "aggressive_pursuit"
      Warm: "aggressive_pursuit"
      Hot: "aggressive_pursuit"
      Very_Hot: "swing_trade"
      Extreme_Hot: "defensive_hold"

# ============================================================
# Risk Control Engine 配置
# ============================================================
risk_control:
  max_positions: 5
  max_per_position_pct: 0.15
  max_per_theme_pct: 0.30
  stop_loss_atr_multiple: 1.2
  take_profit_atr_multiple: 2.0
  max_daily_drawdown: 0.03
  max_weekly_drawdown: 0.06
  max_monthly_drawdown: 0.12
  trailing_stop_activation: 0.08
  trailing_stop_distance: 0.05
  rebalance_threshold: 0.05
  min_hold_days: 3
  dynamic_stop:
    enabled: true
    volatility_multiplier: 1.5
    max_stop_loss: 0.12
    min_stop_loss: 0.03
