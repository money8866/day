# ============================================================
# 机构主线识别系统 - 主配置文件
# ============================================================

general:
  lookback_days: 120
  min_trade_days: 60
  top_n: 20
  output_dir: "./output"
  cache_dir: "./cache"
  max_workers: 8

# --- ETF轮动引擎 (Module 1) ---
etf_rotation:
  trend_weight: 0.25
  persistence_weight: 0.15
  relative_strength_weight: 0.15
  relative_momentum_weight: 0.15
  volume_trend_weight: 0.10
  atr_weight: 0.05
  adx_weight: 0.05
  breakout_60d: 0.03
  breakout_90d: 0.03
  breakout_120d: 0.02
  relative_etf_rank_weight: 0.02
  ema_fast: 20
  ema_mid: 60
  ema_slow: 120
  adx_period: 14
  rs_period: 60
  top10_days_period: 20
  etf_list:
    - 512480.SH  # 半导体
    - 159995.SZ  # 芯片
    - 159516.SZ  # 半导体设备
    - 159819.SZ  # 人工智能
    - 515230.SH  # 软件
    - 515880.SH  # 通信
    - 159732.SZ  # 消费电子
    - 159851.SZ  # 金融科技
    - 159869.SZ  # 游戏
    - 516160.SH  # 新能源
    - 515790.SH  # 光伏
    - 159566.SZ  # 储能
    - 159755.SZ  # 电池
    - 515030.SH  # 新能源车
    - 159992.SZ  # 创新药
    - 159883.SZ  # 医疗器械
    - 512010.SH  # 医药
    - 512660.SH  # 军工
    - 159227.SZ  # 航空航天
    - 562500.SH  # 机器人
    - 516650.SH  # 有色金属
    - 159870.SZ  # 化工
    - 515220.SH  # 煤炭
    - 515210.SH  # 钢铁
    - 159611.SZ  # 电力
    - 561380.SH  # 电网设备
    - 159928.SZ  # 消费
    - 159736.SZ  # 食品饮料
    - 512690.SH  # 酒
    - 159996.SZ  # 家电
    - 512880.SH  # 证券
    - 512800.SH  # 银行
    - 515180.SH  # 红利
    - 518880.SH  # 黄金
    - 159667.SZ  # 工业母机

# --- 机构资金引擎 (Module 2) ---
institution_flow:
  continuous_inflow_weight: 0.25
  institution_participation_weight: 0.20
  capital_persistence_weight: 0.15
  volume_amplification_weight: 0.15
  capital_concentration_weight: 0.15
  capital_acceleration_weight: 0.10
  moneyflow_period: 20
  north_period: 20
  margin_period: 20

# --- 市场热度引擎 (Module 3) ---
market_heat:
  hot_rank_weight: 0.25
  hot_days_weight: 0.15
  limit_up_count_weight: 0.15
  limit_break_rate_weight: 0.10
  sector_heat_weight: 0.20
  broker_recommend_weight: 0.15
  hot_period: 10
  limit_period: 5

# --- 产业生命周期引擎 (Module 4) ---
lifecycle:
  trend_stage_weight: 0.25
  capital_stage_weight: 0.20
  volume_stage_weight: 0.15
  limit_up_stage_weight: 0.15
  leader_height_weight: 0.15
  heat_stage_weight: 0.10
  lookback_short: 20
  lookback_mid: 60
  lookback_long: 120

# --- 龙头发现引擎 (Module 5) ---
leader:
  relative_strength_weight: 0.18
  relative_return_weight: 0.12
  relative_volume_weight: 0.10
  relative_high_weight: 0.10
  relative_momentum_weight: 0.10
  relative_drawdown_weight: 0.05
  relative_rank_weight: 0.05
  correlation_etf_weight: 0.08
  beta_etf_weight: 0.05
  trend_stability_weight: 0.05
  sharpe_weight: 0.04
  calmar_weight: 0.03
  breakout_quality_weight: 0.03
  institution_ownership_weight: 0.02
  liquidity_weight: 0.02
  con新高_count_weight: 0.03
  relative_period: 60
  min_correlation: 0.3

# --- 龙头持续性引擎 (Module 6) ---
persistence:
  top3_count_weight: 0.20
  continuous_top3_weight: 0.15
  new_high_count_weight: 0.15
  etf_lead_days_weight: 0.15
  breakout_count_weight: 0.10
  pullback_success_weight: 0.15
  main_up_duration_weight: 0.10
  lookback_period: 60
  top3_period: 20

# --- 共振引擎 (Module 7) ---
resonance:
  etf_trend_weight: 0.25
  capital_weight: 0.20
  relative_strength_weight: 0.15
  correlation_weight: 0.10
  breakout_weight: 0.10
  market_heat_weight: 0.10
  leader_persistence_weight: 0.10

# --- 风险引擎 (Module 9) ---
risk:
  atr_weight: 0.15
  drawdown_weight: 0.20
  gap_risk_weight: 0.10
  beta_weight: 0.15
  volatility_weight: 0.15
  etf_drawdown_weight: 0.15
  market_risk_weight: 0.10
  atr_period: 14
  drawdown_lookback: 60

# --- 买入信号 (Module 10) ---
buy_signal:
  ema20_retrace_max_pct: -1.0
  ema20_retrace_volume_max: 0.8
  platform_breakout_volume_min: 1.5
  vcp_contraction_count: 3
  htf_base_days: 15
  htf_max_retrace: -25.0
  consolidation_volume_max: 0.7
  week52_breakout_volume_min: 1.3
  wave2_volume_ratio_min: 0.65
  wave2_volume_ratio_max: 0.85

# --- 卖出信号 (Module 11) ---
sell_signal:
  ema20_break_pct: -2.0
  atr_stop_multiple: 2.0
  etf_trend_threshold: 60
  theme_heat_threshold: 40
  leader_change_days: 5
  volume_stagnation_days: 5
  stagnation_volume_max: 1.2

# --- 综合评分 (Module 12) ---
composite:
  etf_trend_weight: 0.20
  capital_weight: 0.20
  heat_weight: 0.10
  lifecycle_weight: 0.10
  leader_weight: 0.15
  leader_persistence_weight: 0.10
  resonance_weight: 0.10
  risk_penalty: -0.05

# --- 回测设置 (Module 14) ---
backtest:
  walk_forward_window: 252
  rolling_window: 60
  retrain_frequency: 20
  initial_capital: 1_000_000
  commission_pct: 0.0003
  max_positions: 10
  stop_loss_atr: 2.0
  take_profit_atr: 6.0
  bayesian_iterations: 50

