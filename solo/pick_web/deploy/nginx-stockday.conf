server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    # ---- 会话校验：交给门户服务，供 auth_request 单点登录 ----
    location = /__auth {
        internal;
        proxy_pass http://127.0.0.1:8000/api/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ---- 选股信号查询：/picks/ -> 127.0.0.1:8001 ----
    location = /picks {
        return 301 /picks/;
    }

    location /picks/ {
        auth_request /__auth;
        error_page 401 = @need_login;
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 每日复盘：/review/ -> 127.0.0.1:8003 ----
    location = /review {
        return 301 /review/;
    }

    location /review/ {
        auth_request /__auth;
        error_page 401 = @need_login;
        proxy_pass http://127.0.0.1:8003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- 三级行业共振：/l3res/ -> 127.0.0.1:8004 ----
    location = /l3res {
        return 301 /l3res/;
    }

    location /l3res/ {
        auth_request /__auth;
        error_page 401 = @need_login;
        proxy_pass http://127.0.0.1:8004/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- A股资讯与热度：/news/ -> 127.0.0.1:8002 ----
    location = /news {
        return 301 /news/;
    }

    location /news/ {
        auth_request /__auth;
        error_page 401 = @need_login;
        proxy_pass http://127.0.0.1:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- ETF 每日复盘：/etf/ -> 127.0.0.1:8005 ----
    location = /etf {
        return 301 /etf/;
    }

    location /etf/ {
        auth_request /__auth;
        error_page 401 = @need_login;
        proxy_pass http://127.0.0.1:8005/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 未登录访问子页 -> 回首页登录
    location @need_login {
        return 302 /;
    }

    # ---- 首页：登录 + 总入口 -> 127.0.0.1:8000 ----
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
