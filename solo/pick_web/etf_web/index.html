<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ETF 每日复盘 · 中证2000</title>
<style>
:root{
  --bg:#f2f4f7; --card:#fff; --line:#e6e9ef; --ink:#1f2430; --dim:#7a8496;
  --brand:#1a5fb4; --brand2:#3584e4; --chip:#eef3fb;
  --up:#c8362f; --down:#1a7f47; --warn:#b45309; --band:rgba(53,132,228,.14);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--ink);font-size:17px;line-height:1.65;-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto;padding:14px}
a{color:var(--brand);text-decoration:none}

.head{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  border-radius:12px;padding:18px 20px;box-shadow:0 2px 10px rgba(26,95,180,.22)}
.head h1{font-size:20px;font-weight:600}
.head .sub{font-size:13.5px;opacity:.92;margin-top:4px}
.head .meta{font-size:12.5px;opacity:.9;margin-top:10px;padding-top:10px;
  border-top:1px solid rgba(255,255,255,.25);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.head .meta a{font-size:13px;padding:6px 12px;border-radius:7px;
  border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);color:#fff}
.head .meta a:hover{background:rgba(255,255,255,.28)}
.head .meta .gap{flex:1 1 auto}

.card{background:var(--card);border-radius:12px;box-shadow:0 1px 5px rgba(20,35,60,.07);
  padding:14px 16px;margin-top:12px}
.card .ct{font-size:14px;font-weight:600;color:var(--dim);margin-bottom:8px}
.empty{padding:26px 6px;color:var(--dim);text-align:center;font-size:15px}

/* ---- 列表 ---- */
.list{margin-top:12px}
.month{font-size:14px;font-weight:600;color:var(--dim);padding:12px 4px 6px;
  display:flex;justify-content:space-between;align-items:baseline}
.month .n{font-weight:400;font-size:13px}
.cardlist{background:var(--card);border-radius:12px;box-shadow:0 1px 5px rgba(20,35,60,.07);overflow:hidden}
.day{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);
  color:inherit;flex-wrap:wrap}
.day:last-child{border-bottom:none}
.day:hover{background:#f7faff}
.day .d{font-size:17px;font-weight:600;letter-spacing:.3px}
.day .w{font-size:13px;color:var(--dim)}
.day .tag{font-size:12.5px;padding:2px 9px;border-radius:6px;background:var(--chip);color:var(--brand);white-space:nowrap}
.day .tag.ro{background:#fdeeee;color:var(--up)}
.day .tag.full{background:#eaf7ef;color:var(--down)}
.day .gap{flex:1 1 auto}
.day .p{font-size:16px;font-weight:600;min-width:56px;text-align:right}
.day .r{font-size:12.5px;color:var(--dim);text-align:right;white-space:nowrap}

/* ---- 详情 ---- */
.viewbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.viewbar .t{font-size:18px;font-weight:600}
.viewbar .gap{flex:1 1 auto}
.btn{font-family:inherit;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);
  background:#fff;color:var(--brand);min-height:40px;cursor:pointer}
.btn:hover{background:var(--chip)}

.hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
.hero-main{min-width:132px}
.hero-main .hnum{font-size:40px;font-weight:700;line-height:1.1;letter-spacing:-.5px}
.hero-main .hlab{font-size:13px;color:var(--dim)}
.hero-side{flex:1 1 300px;font-size:15.5px}
.hero-side .hline{display:flex;gap:10px;padding:3px 0}
.hero-side .hline b{color:var(--dim);font-weight:400;min-width:78px}
.pill{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:20px;
  background:var(--chip);color:var(--brand);margin-left:6px}
.pill.no{background:#f1f3f7;color:var(--dim)}
.pill.yes{background:#eaf7ef;color:var(--down)}
.pill.warn{background:#fdf3e6;color:var(--warn)}

/* ---- 状态刻度 ---- */
.scale .srow{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:14.5px}
.scale .srow.cur{font-weight:700}
.scale .sname{width:132px;flex:0 0 auto;color:var(--dim);white-space:nowrap}
.scale .srow.cur .sname{color:var(--ink)}
.scale .strack{position:relative;flex:1 1 auto;height:16px;background:#f1f3f7;border-radius:5px;overflow:hidden}
.scale .band{position:absolute;top:0;bottom:0;background:var(--band)}
.scale .srow.cur .band{background:rgba(53,132,228,.34)}
.scale .mark{position:absolute;top:-2px;bottom:-2px;width:3px;background:var(--brand);border-radius:2px}
.scale .sval{width:92px;flex:0 0 auto;text-align:right;color:var(--dim);font-size:13px}

/* ---- 图表 ---- */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--dim);margin-bottom:6px}
.legend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.tip{position:absolute;top:6px;left:6px;pointer-events:none;background:rgba(31,36,48,.92);color:#fff;
  font-size:12.5px;line-height:1.5;padding:6px 9px;border-radius:7px;white-space:pre;display:none;z-index:5}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .card{margin-top:0}
.grid2{margin-top:12px}

/* ---- 文字块 ---- */
.blocks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.blocks .card{margin-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:15.5px}
.kv b{color:var(--dim);font-weight:400;white-space:nowrap}
.lines{font-size:15.5px;white-space:pre-wrap;word-break:break-word}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips span{font-size:13px;padding:3px 10px;border-radius:6px;background:var(--chip);color:var(--brand)}
.chips span.ro{background:#fdeeee;color:var(--up)}
.chips span.dv{background:#fdf3e6;color:var(--warn)}
.chips span.ok{background:#eaf7ef;color:var(--down)}

.evs{font-size:15px}
.evs .ev{display:flex;gap:10px;padding:4px 0;border-bottom:1px dashed var(--line)}
.evs .ev:last-child{border-bottom:none}
.evs .ev b{font-weight:600;min-width:132px}
.evs .ev span{color:var(--dim)}

.plan .prow{display:flex;gap:10px;padding:3px 0;font-size:15.5px}
.plan .prow b{color:var(--dim);font-weight:400;min-width:96px}
.plan ul{margin:8px 0 0 0;padding-left:20px;font-size:15px;color:var(--ink)}
.plan li{padding:2px 0}
.plan .act{display:inline-block;font-size:15px;font-weight:700;padding:3px 12px;border-radius:7px;
  background:var(--chip);color:var(--brand)}
.plan .act.BUY{background:#fdeeee;color:var(--up)}
.plan .act.SELL{background:#eaf7ef;color:var(--down)}

.foot{color:var(--dim);font-size:13px;text-align:center;padding:16px 0 26px}
#v-view{display:none}

@media (max-width:820px){
  .grid2,.blocks{grid-template-columns:1fr}
  .scale .sname{width:104px}
  .scale .sval{width:78px;font-size:12.5px}
}
@media (max-width:600px){
  .wrap{padding:10px}
  .hero-main .hnum{font-size:34px}
  .day{padding:12px 13px;gap:8px}
  .day .r{display:none}
  .evs .ev b{min-width:104px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="head">
    <h1>ETF 每日复盘 · 中证2000ETF</h1>
    <div class="sub">逐日仓位：状态 / 允许区间 / 满仓资格 / 加减仓条件 + 图示</div>
    <div class="meta">
      <span id="mstat">加载中…</span>
      <span class="gap"></span>
      <a href="/">首页</a>
      <a href="/review/">每日复盘</a>
      <a href="/picks/">选股信号</a>
    </div>
  </div>

  <div id="v-list">
    <div class="list" id="list"></div>
  </div>

  <div id="v-view">
    <div class="viewbar">
      <span class="t" id="vtitle"></span>
      <span class="gap"></span>
      <button class="btn" id="back">‹ 返回列表</button>
    </div>

    <div class="card hero">
      <div class="hero-main">
        <div class="hnum" id="h-pos">–</div>
        <div class="hlab">当前仓位</div>
      </div>
      <div class="hero-side" id="h-side"></div>
    </div>

    <div class="card scale">
      <div class="ct">仓位阶梯（六档状态区间 · 竖线为当日仓位）</div>
      <div id="scale"></div>
    </div>

    <div class="grid2">
      <div class="card">
        <div class="ct">仓位（近 <span id="n-days">60</span> 个交易日）</div>
        <div class="legend">
          <span><i style="background:#3584e4"></i>实际仓位</span>
          <span><i style="background:#9aa6b8"></i>区间中枢</span>
          <span><i style="background:rgba(53,132,228,.34)"></i>允许区间</span>
        </div>
        <div class="chart" id="ch-pos"></div>
      </div>
      <div class="card">
        <div class="ct">中证2000 指数与均线</div>
        <div class="legend">
          <span><i style="background:#1f2430"></i>收盘</span>
          <span><i style="background:#3584e4"></i>MA20</span>
          <span><i style="background:#e0a33a"></i>MA60</span>
        </div>
        <div class="chart" id="ch-idx"></div>
      </div>
    </div>

    <div class="card">
      <div class="ct">市场宽度：收盘价在 MA20 之上的成分股占比（%）</div>
      <div class="legend">
        <span><i style="background:#3584e4"></i>MA20 上方占比</span>
        <span><i style="background:#d8b26a"></i>参考线 35 / 55 / 65%</span>
      </div>
      <div class="chart" id="ch-br"></div>
    </div>

    <div class="blocks" id="blocks"></div>

    <div class="card" id="c-ev" style="display:none">
      <div class="ct">当日事件</div>
      <div class="evs" id="events"></div>
    </div>

    <div class="card" id="c-plan" style="display:none">
      <div class="ct">ETF 执行计划（<span id="plan-src"></span>）</div>
      <div class="plan" id="plan"></div>
    </div>
  </div>

  <div class="foot">仓位由 position_gate 模块盘后产出，本页只读展示，不改写、不重算</div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt1 = v => (v == null ? '–' : Number(v).toFixed(1));
const fmt2 = v => (v == null ? '–' : Number(v).toFixed(2));
const dash = s => s.slice(0,4) + '-' + s.slice(4,6) + '-' + s.slice(6);

const EV_CN = {
  REGIME_CHANGE:'状态切换', POSITION_UP:'加仓', POSITION_DOWN:'减仓',
  FULL_EXPOSURE_ELIGIBLE:'取得满仓资格',
  INDEX_BREADTH_DIVERGENCE:'指数背离', HEALTHY_PULLBACK:'健康回调',
  R1_close_below_ma20_2d:'R1 连续2日跌破MA20', R2_below_ma20_volume:'R2 破位放量',
  R3_drop5:'R3 5日跌幅超限', R4_drop20:'R4 20日跌幅超限', R5_breadth_drop:'R5 宽度骤降',
  R6_newlow_gt_newhigh:'R6 新低多于新高', R7_rs20_deteriorate:'R7 相对强度恶化'
};
const EV_CLS = e => e.indexOf('R') === 0 ? 'ro'
  : (e === 'FULL_EXPOSURE_ELIGIBLE' ? 'ok'
  : (e === 'INDEX_BREADTH_DIVERGENCE' ? 'dv' : ''));

let META = null, DATES = null;

/* ══════════════ 通用折线图（内联 SVG，无外部依赖） ══════════════ */
function lineChart(host, cfg){
  const W = cfg.w || 720, H = cfg.h || 232;
  const P = Object.assign({l: 48, r: 54, t: 14, b: 26}, cfg.pad || {});
  const xs = cfg.xs, n = xs.length;
  if (!n){ host.innerHTML = '<div class="empty">无数据</div>'; return; }
  const ymin = cfg.ymin, ymax = cfg.ymax;
  const iw = W - P.l - P.r, ih = H - P.t - P.b;
  const X = i => P.l + (n === 1 ? iw / 2 : i * iw / (n - 1));
  const Y = v => P.t + (ymax - v) / ((ymax - ymin) || 1) * ih;
  let s = [];

  if (cfg.bands){
    const bw = n > 1 ? iw / (n - 1) : iw;
    cfg.bands.lo.forEach((lo, i) => {
      const hi = cfg.bands.hi[i];
      if (lo == null || hi == null) return;
      s.push('<rect x="' + (X(i) - bw / 2).toFixed(1) + '" y="' + Y(hi).toFixed(1) +
             '" width="' + Math.max(1, bw).toFixed(1) + '" height="' +
             Math.max(0.8, Y(lo) - Y(hi)).toFixed(1) + '" fill="' + (cfg.bands.color ||
             'rgba(53,132,228,.14)') + '"/>');
    });
  }

  (cfg.refs || []).forEach(r => {
    s.push('<line x1="' + P.l + '" y1="' + Y(r.y).toFixed(1) + '" x2="' + (W - P.r) +
           '" y2="' + Y(r.y).toFixed(1) + '" stroke="' + (r.color || '#d8b26a') +
           '" stroke-width="1" stroke-dasharray="4 4"/>');
    if (r.label !== false)
      s.push('<text x="' + (W - P.r + 5) + '" y="' + (Y(r.y) + 4).toFixed(1) +
             '" font-size="11" fill="#9aa6b8">' + esc(r.text == null ? r.y : r.text) + '</text>');
  });

  // 横向网格
  (cfg.ticks || []).forEach(t => {
    s.push('<line x1="' + P.l + '" y1="' + Y(t).toFixed(1) + '" x2="' + (W - P.r) +
           '" y2="' + Y(t).toFixed(1) + '" stroke="#eef1f6" stroke-width="1"/>');
    s.push('<text x="' + (P.l - 6) + '" y="' + (Y(t) + 4).toFixed(1) +
           '" font-size="11" fill="#9aa6b8" text-anchor="end">' +
           esc(cfg.yfmt ? cfg.yfmt(t) : t) + '</text>');
  });

  // 数据线（支持空值断线）
  (cfg.lines || []).forEach(L => {
    let d = '', open = false;
    L.data.forEach((v, i) => {
      if (v == null || !isFinite(v)){ open = false; return; }
      d += (open ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(v).toFixed(1) + ' ';
      open = true;
    });
    if (d) s.push('<path d="' + d.trim() + '" fill="none" stroke="' + L.color +
                  '" stroke-width="' + (L.width || 2) + '" stroke-linejoin="round"' +
                  (L.dash ? ' stroke-dasharray="' + L.dash + '"' : '') + '/>');
    if (L.lastLabel){
      for (let i = n - 1; i >= 0; i--){
        if (L.data[i] != null && isFinite(L.data[i])){
          s.push('<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(L.data[i]).toFixed(1) +
                 '" r="3" fill="' + L.color + '"/>' +
                 '<text x="' + (W - P.r + 5) + '" y="' + (Y(L.data[i]) + 4).toFixed(1) +
                 '" font-size="12" font-weight="600" fill="' + L.color + '">' +
                 esc(L.fmt ? L.fmt(L.data[i]) : fmt2(L.data[i])) + '</text>');
          break;
        }
      }
    }
  });

  // x 轴标签
  [0, Math.floor((n - 1) / 2), n - 1].forEach((i, k) => {
    if (i < 0) return;
    s.push('<text x="' + X(i).toFixed(1) + '" y="' + (H - 6) + '" font-size="11" fill="#9aa6b8" text-anchor="' +
           (k === 0 ? 'start' : k === 2 ? 'end' : 'middle') + '">' +
           esc(dash(xs[i])) + '</text>');
  });

  s.push('<line x1="' + P.l + '" y1="' + (H - P.b) + '" x2="' + (W - P.r) + '" y2="' + (H - P.b) +
         '" stroke="#dfe4ec" stroke-width="1"/>');
  s.push('<line class="hl" x1="0" y1="' + P.t + '" x2="0" y2="' + (H - P.b) +
         '" stroke="#9aa6b8" stroke-width="1" stroke-dasharray="4 3" opacity="0"/>');
  s.push('<rect class="hit" x="' + P.l + '" y="' + P.t + '" width="' + iw + '" height="' + ih +
         '" fill="transparent"/>');

  host.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" ' +
                   'style="height:' + H + 'px">' + s.join('') + '</svg>' +
                   '<div class="tip"></div>';

  // 悬浮读数
  const svg = host.querySelector('svg'), tip = host.querySelector('.tip');
  const hl = svg.querySelector('.hl');
  function move(ev){
    const rect = svg.getBoundingClientRect();
    const cx = (ev.touches ? ev.touches[0].clientX : ev.clientX);
    const px = (cx - rect.left) * W / rect.width;
    let i = Math.round((px - P.l) / (iw / Math.max(1, n - 1)));
    i = Math.max(0, Math.min(n - 1, i));
    hl.setAttribute('x1', X(i)); hl.setAttribute('x2', X(i)); hl.setAttribute('opacity', '1');
    const rows = (cfg.tipRows || cfg.lines.map(L => ({name: L.name, data: L.data, fmt: L.fmt,
      color: L.color}))).filter(L => L.data[i] != null && isFinite(L.data[i]))
      .map(L => L.name + ' ' + (L.fmt ? L.fmt(L.data[i]) : fmt2(L.data[i])));
    tip.textContent = dash(xs[i]) + '\n' + rows.join('\n');
    tip.style.display = 'block';
    const left = X(i) / W * rect.width + 12;
    tip.style.left = Math.min(left, Math.max(0, rect.width - 132)) + 'px';
  }
  function out(){ hl.setAttribute('opacity', '0'); tip.style.display = 'none'; }
  svg.addEventListener('mousemove', move);
  svg.addEventListener('mouseleave', out);
  svg.addEventListener('touchstart', move, {passive: true});
  svg.addEventListener('touchmove', move, {passive: true});
  svg.addEventListener('touchend', out);
}

/* ══════════════ 列表 ══════════════ */
function monthLabel(ym){ return ym.slice(0,4) + ' 年 ' + ym.slice(4,6) + ' 月'; }

function renderList(){
  const byMonth = [];
  DATES.forEach(r => {
    const g = byMonth[byMonth.length - 1];
    if (g && g.ym === r.ym) g.items.push(r);
    else byMonth.push({ym: r.ym, items: [r]});
  });
  $('#list').innerHTML = byMonth.map(g =>
    '<div class="month"><span>' + monthLabel(g.ym) + '</span>' +
      '<span class="n">' + g.items.length + ' 个交易日</span></div>' +
    '<div class="cardlist">' + g.items.map(r =>
      '<a class="day" href="#/' + r.date + '">' +
        '<span class="d">' + dash(r.date) + '</span>' +
        '<span class="w">周' + esc(r.week) + '</span>' +
        '<span class="tag">' + esc(r.regime || '–') + '</span>' +
        (r.riskoff_count ? '<span class="tag ro">Risk-Off ' + r.riskoff_count + '</span>' : '') +
        (r.full_exposure_eligible ? '<span class="tag full">满仓资格</span>' : '') +
        '<span class="gap"></span>' +
        '<span class="p">' + fmt1(r.position) + '%</span>' +
        '<span class="r">' + fmt1(r.position_min) + '~' + fmt1(r.position_max) + '%</span>' +
      '</a>').join('') + '</div>').join('');
  $('#mstat').textContent = '共 ' + DATES.length + ' 个交易日 · 最新 ' + dash(DATES[0].date);
}

function showList(){
  $('#v-list').style.display = 'block';
  $('#v-view').style.display = 'none';
  document.title = 'ETF 每日复盘 · 中证2000';
  window.scrollTo(0, 0);
}

/* ══════════════ 详情 ══════════════ */
function renderBlocks(blocks){
  $('#blocks').innerHTML = blocks.map(b => {
    let inner;
    if (b.kind === 'kv')
      inner = '<div class="kv">' + b.items.map(it =>
        '<b>' + esc(it[0]) + '</b><span>' + esc(it[1]) + '</span>').join('') + '</div>';
    else if (b.kind === 'chips')
      inner = '<div class="chips">' + b.chips.map(c =>
        '<span>' + esc(c) + '</span>').join('') + '</div>';
    else
      inner = '<div class="lines">' + esc(b.lines.join('\n')) + '</div>';
    return '<div class="card"><div class="ct">' + esc(b.title) + '</div>' + inner + '</div>';
  }).join('');
}

function renderScale(p){
  const bands = (META && META.bands) || [];
  const pos = p.position == null ? 0 : p.position;
  $('#scale').innerHTML = bands.map(b => {
    const cur = b.regime === p.regime;
    const l = b.min, w = Math.max(0, b.max - b.min);
    return '<div class="srow' + (cur ? ' cur' : '') + '">' +
      '<span class="sname">' + esc(b.regime) + ' ' + esc((META.regime_cn || {})[b.regime] || '') + '</span>' +
      '<span class="strack">' +
        '<i class="band" style="left:' + l + '%;width:' + w + '%"></i>' +
        '<b class="mark" style="left:' + Math.max(0, Math.min(99.5, pos)) + '%"></b>' +
      '</span>' +
      '<span class="sval">' + fmt1(b.min) + '～' + fmt1(b.max) + '%</span>' +
    '</div>';
  }).join('');
}

function renderCharts(p){
  const S = p.series;
  const xs = S.map(x => x.date);
  $('#n-days').textContent = S.length;

  lineChart($('#ch-pos'), {
    xs: xs, ymin: 0, ymax: 100, ticks: [0, 25, 50, 75, 100],
    yfmt: v => v + '%',
    bands: {lo: S.map(x => x.position_min), hi: S.map(x => x.position_max)},
    lines: [
      {name: '区间中枢', data: S.map(x => x.position_target), color: '#9aa6b8', width: 1.6,
       dash: '5 4', fmt: v => fmt1(v) + '%'},
      {name: '实际仓位', data: S.map(x => x.position), color: '#3584e4', width: 2.6,
       lastLabel: true, fmt: v => fmt1(v) + '%'}
    ]
  });

  const all = [];
  S.forEach(x => { all.push(x.close, x.ma20, x.ma60); });
  const ok = all.filter(v => v != null && isFinite(v));
  const lo = ok.length ? Math.min.apply(null, ok) : 0;
  const hi = ok.length ? Math.max.apply(null, ok) : 1;
  const pad = (hi - lo) * 0.08 || 1;
  lineChart($('#ch-idx'), {
    xs: xs, ymin: lo - pad, ymax: hi + pad,
    ticks: [lo, lo + (hi - lo) / 2, hi].map(v => Math.round(v)),
    yfmt: v => Math.round(v),
    lines: [
      {name: '收盘', data: S.map(x => x.close), color: '#1f2430', width: 2.4,
       lastLabel: true, fmt: v => Math.round(v)},
      {name: 'MA20', data: S.map(x => x.ma20), color: '#3584e4', width: 1.6},
      {name: 'MA60', data: S.map(x => x.ma60), color: '#e0a33a', width: 1.6}
    ]
  });

  lineChart($('#ch-br'), {
    xs: xs, ymin: 0, ymax: 100, ticks: [0, 25, 50, 75, 100],
    yfmt: v => v + '%',
    refs: [{y: 65, text: '65%'}, {y: 55, text: '55%'}, {y: 35, text: '35%'}],
    lines: [{name: 'MA20上方占比', data: S.map(x => x.breadth_ma20), color: '#3584e4',
             width: 2.4, lastLabel: true, fmt: v => fmt1(v) + '%'}]
  });
}

function renderEvents(p){
  if (!p.events || !p.events.length){ $('#c-ev').style.display = 'none'; return; }
  $('#c-ev').style.display = 'block';
  $('#events').innerHTML = p.events.map(e =>
    '<div class="ev"><b class="' + EV_CLS(e.event) + '">' + esc(EV_CN[e.event] || e.event) +
    '</b><span>' + esc(e.detail || '') + '</span></div>').join('');
}

function renderPlan(pl){
  if (!pl){ $('#c-plan').style.display = 'none'; return; }
  const ex = pl.execution || {}, rc = pl.risk_control || {}, mg = pl.market_gate || {};
  $('#c-plan').style.display = 'block';
  $('#plan-src').textContent = (pl.instrument ? pl.instrument.code + ' ' + pl.instrument.name : '') +
    ' · ' + (pl.date || '');
  let h = '<div class="prow"><b>执行动作</b><span class="act ' + esc(ex.action || '') + '">' +
    esc(ex.action || '–') + '</span></div>';
  h += '<div class="prow"><b>计划调仓</b><span>' +
    (ex.planned_delta_pct == null ? '–' : (ex.planned_delta_pct > 0 ? '+' : '') + fmt1(ex.planned_delta_pct) + '%') +
    '（阈值 ' + fmt1(ex.min_rebalance_pct) + '%，单次上限 ' + fmt1(ex.max_single_adjust_pct) + '%）</span></div>';
  h += '<div class="prow"><b>Gate 目标</b><span>' + esc(mg.regime || '–') + ' · ' +
    fmt1(mg.target_position_pct) + '%（' + fmt1(mg.allowed_min_pct) + '~' + fmt1(mg.allowed_max_pct) + '%）</span></div>';
  h += '<div class="prow"><b>波动止损</b><span>' + fmt2(rc.volatility_stop) +
    '（ATR' + (rc.atr_window || '') + ' ' + fmt2(rc.atr) + '，ATR% ' + fmt2(rc.atr_pct) + '，×' +
    fmt1(rc.atr_multiplier) + '）</span></div>';
  if (rc.price_note) h += '<div class="prow"><b>价格口径</b><span>' + esc(rc.price_note) + '</span></div>';
  if (rc.logic_invalidations && rc.logic_invalidations.length)
    h += '<div class="prow"><b>逻辑失效</b><span>' + esc(rc.logic_invalidations.join('；')) + '</span></div>';
  if (pl.checklist && pl.checklist.length)
    h += '<ul>' + pl.checklist.map(c => '<li>' + esc(c) + '</li>').join('') + '</ul>';
  $('#plan').innerHTML = h;
}

async function showDay(date){
  $('#v-list').style.display = 'none';
  $('#v-view').style.display = 'block';
  window.scrollTo(0, 0);
  let p;
  try {
    const res = await fetch('api/day?date=' + date, {cache: 'no-store'});
    if (!res.ok) throw new Error((await res.json()).detail || ('HTTP ' + res.status));
    p = await res.json();
  } catch (err){
    $('#blocks').innerHTML = '<div class="card"><div class="empty">加载失败：' + esc(err.message) + '</div></div>';
    return;
  }
  $('#vtitle').textContent = dash(p.date) + '（周' + p.week + '）';
  document.title = dash(p.date) + ' ETF 仓位 · 中证2000';

  $('#h-pos').textContent = fmt1(p.position) + '%';
  const pills = [];
  pills.push('<span class="pill">' + esc(p.regime) + ' ' + esc(p.regime_cn) + '</span>');
  pills.push('<span class="pill">区间 ' + fmt1(p.position_min) + '～' + fmt1(p.position_max) + '%</span>');
  pills.push('<span class="pill">中枢 ' + fmt1(p.position_target) + '%</span>');
  pills.push('<span class="pill ' + (p.full_exposure_eligible ? 'yes' : 'no') + '">满仓资格 ' +
    (p.full_exposure_eligible ? 'YES' : 'NO') + '</span>');
  pills.push('<span class="pill ' + (p.riskoff_count >= 2 ? 'warn' : 'no') + '">Risk-Off ' +
    p.riskoff_count + '</span>');
  $('#h-side').innerHTML =
    '<div class="hline"><b>市场状态</b><span>' + esc(p.regime) + ' / ' + esc(p.regime_cn) + '</span></div>' +
    '<div class="hline"><b>允许区间</b><span>' + fmt1(p.position_min) + '%～' + fmt1(p.position_max) +
    '%　中枢 ' + fmt1(p.position_target) + '%</span></div>' +
    '<div class="hline"><b>满仓资格</b><span>' + (p.full_exposure_eligible ? 'YES' : 'NO') +
    '　Risk-Off ' + p.riskoff_count + '</span></div>' +
    '<div class="hline"><b>摘要</b><span>' + pills.join('') + '</span></div>';

  renderScale(p);
  renderCharts(p);
  renderBlocks(p.blocks);
  renderEvents(p);
  renderPlan(p.plan);
}

function route(){
  const m = location.hash.match(/^#\/(\d{8})$/);
  if (m && DATES.some(x => x.date === m[1])) showDay(m[1]);
  else showList();
}

async function boot(){
  try {
    const res = await fetch('api/meta', {cache: 'no-store'});
    META = await res.json();
  } catch (err){ META = null; }
  try {
    const res = await fetch('api/dates', {cache: 'no-store'});
    const d = await res.json();
    DATES = d.dates || [];
  } catch (err){
    $('#list').innerHTML = '<div class="card"><div class="empty">日期清单加载失败：' +
      esc(err.message) + '</div></div>';
    $('#mstat').textContent = '加载失败';
    return;
  }
  if (!DATES.length){
    $('#list').innerHTML = '<div class="card"><div class="empty">暂无数据：' +
      '未读到 position_gate 输出（csi2000_position_gate_daily.csv）。</div></div>';
    $('#mstat').textContent = '暂无数据';
    return;
  }
  renderList();
  route();
}

$('#back').addEventListener('click', function(){
  if (location.hash) location.hash = '';
  else showList();
});
window.addEventListener('hashchange', route);
boot();
</script>
</body>
</html>
